name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller pillow
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --hidden-import=html.parser --name roms2img src/roms2img.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: roms2img-windows-exe
          path: dist/roms2img.exe
          if-no-files-found: error
          retention-days: 30
